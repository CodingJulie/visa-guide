<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>VisaGuide — Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-card {
            background: white;
            border-radius: 32px;
            padding: 48px 32px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .icon { width: 96px; height: auto; margin-bottom: 24px; }
        h1 { font-size: 28px; color: #2563eb; margin-bottom: 12px; }
        p { color: #6b7280; margin-bottom: 32px; line-height: 1.5; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        .retry-btn { background: #f3f4f6; color: #374151; margin-top: 12px; }
        .retry-btn:hover { background: #e5e7eb; }
    </style>
</head>
<body>
<div class="offline-card">
    <img class="icon" src="/noun-usa-2554196.png" alt="VisaGuide">
    <h1>No connection</h1>
    <p>Check your internet connection and try again</p>
    <button onclick="location.reload()">Refresh page</button>
    <button class="retry-btn" onclick="goToHome()">Back to home</button>
</div>

<script>
    function goToHome() {
        window.location.assign('/?fromOffline=1');
    }

    window.addEventListener('online', () => {
        location.reload();
    });
</script>
</body>
</html>
